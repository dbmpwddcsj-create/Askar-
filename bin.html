<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#7B3FE4',dark:'#1A1A22',profit:'#28A745',danger:'#FF5722'}}}}</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{margin:0;font-family:Inter,Arial,sans-serif}.gradient{background:linear-gradient(135deg,#7B3FE4,#4d1c98)}.gridbg{background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:42px 42px}</style>
</head><body class="bg-dark"><div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const Icon=({name,className="w-5 h-5"})=><i data-lucide={name} className={className}/>;
function useIcons(){useEffect(()=>{if(window.lucide)lucide.createIcons()},[])}
function Btn({children,onClick,variant="primary",icon,className=""}){let s={primary:"bg-primary hover:bg-purple-700",green:"bg-profit hover:bg-green-600",danger:"bg-danger hover:bg-red-600",outline:"border border-primary text-primary hover:bg-primary hover:text-white",blue:"bg-blue-600 hover:bg-blue-700",ghost:"bg-white/5 hover:bg-white/10"};return <button onClick={onClick} className={`rounded-xl px-5 py-3 font-medium text-white transition flex items-center justify-center gap-2 ${s[variant]} ${className}`}>{icon&&<Icon name={icon}/>} {children}</button>}
const Card=({children,className=""})=><div className={`rounded-2xl ${className}`}>{children}</div>;
function Risk(){return <div className="text-xs leading-5 text-gray-500 mt-8 border-t border-white/10 pt-6"><b className="text-gray-400 block mb-2">Предупреждение о рисках</b>Торговые операции, осуществляемые на платформе, сопряжены с существенным риском потери капитала. Пожалуйста, внимательно ознакомьтесь с общими условиями торговли, представленными на нашем сайте, перед осуществлением любых инвестиций. Вам предоставляется право личного, некоммерческого использования информационной системы, размещенной на данном сайте. Право использования является ограниченным и неисключительным. Деятельность компании ведется за пределами Российской Федерации.</div>}
function Footer({dark=false}){return <footer className={`${dark?"bg-dark text-gray-500 border-white/5":"bg-white text-gray-500 border-gray-100"} border-t text-center py-6 text-sm`}>Все права защищены 2026. Bin</footer>}
function Top({go}){useIcons();return <header className="h-16 border-b border-white/10 bg-dark/95 flex items-center justify-between px-4 md:px-8 sticky top-0 z-30"><button onClick={()=>go("dashboard")} className="text-2xl font-bold text-white"><span className="text-primary">B</span>in</button><div className="flex items-center gap-3"><button className="relative p-3 rounded-xl bg-white/5"><Icon name="bell" className="text-gray-400"/><span className="absolute top-2 right-2 w-2 h-2 bg-primary rounded-full"/></button><span className="hidden sm:block text-gray-400">0 ₽</span><Btn onClick={()=>go("trade")} icon="trending-up" className="py-2 px-4">Торговать</Btn></div></header>}
function Nav({go,active}){useIcons();return <nav className="fixed bottom-0 left-0 right-0 bg-dark/95 border-t border-white/10 z-40"><div className="max-w-4xl mx-auto flex justify-around py-3">{[["profile","user-round","Профиль"],["support","headphones","Поддержка"],["history","history","История"]].map(x=><button key={x[0]} onClick={()=>go(x[0])} className={`flex flex-col items-center gap-1 text-xs ${active===x[0]?"text-primary":"text-gray-500"}`}><Icon name={x[1]}/>{x[2]}</button>)}</div></nav>}
function Layout({children,go,active}){return <div className="min-h-screen bg-dark text-white pb-20"><Top go={go}/>{children}<Nav go={go} active={active}/></div>}
function Mini({green=false}){return <svg viewBox="0 0 300 90" className="w-full h-24"><polyline fill="none" stroke={green?"#28A745":"#7B3FE4"} strokeWidth="3" points="0,70 25,55 45,65 70,35 95,48 120,20 145,38 170,18 195,30 220,12 245,22 270,5 300,15"/></svg>}
function Landing({go}){return <div className="min-h-screen bg-white text-gray-900"><header className="flex justify-between items-center px-6 md:px-12 py-5"><b className="text-2xl"><span className="text-primary">B</span>in</b><Btn onClick={()=>go("auth")} className="py-2">Войти</Btn></header><main className="max-w-6xl mx-auto px-6 py-16 grid md:grid-cols-2 gap-12 items-center"><div><h1 className="text-4xl md:text-6xl font-bold leading-tight mb-6">Платформа для понятных и разумных инвестиций</h1><p className="text-lg text-gray-500 mb-8">Регистрируйся и используй возможности платформы</p><Btn onClick={()=>go("auth")}>Начать работу</Btn></div><div className="flex justify-center"><div className="w-64 h-[480px] bg-gray-900 rounded-[40px] border-8 border-gray-200 shadow-2xl p-5"><div className="text-white text-center mt-10 mb-6"><small className="text-gray-400">Ваш баланс</small><div className="text-2xl font-bold">0 ₽</div></div><div className="bg-gray-800 rounded-xl p-3"><small className="text-gray-400">BTC / USDT</small><b className="text-white block mb-3">98 240,50</b><Mini green/></div><div className="mt-5 grid grid-cols-2 gap-2"><div className="bg-profit/20 text-profit p-3 rounded-lg text-center">Вверх</div><div className="bg-danger/20 text-danger p-3 rounded-lg text-center">Вниз</div></div></div></div></main><Footer/></div>}
function Auth({go}){const[t,setT]=useState("login"),[ok,setOk]=useState(false);return <div className="min-h-screen bg-white text-gray-900"><header className="px-6 py-5 border-b flex justify-between"><b className="text-2xl"><span className="text-primary">B</span>in</b><button onClick={()=>go("landing")} className="text-gray-500">На главную</button></header><main className="max-w-md mx-auto px-6 py-12"><div className="flex bg-gray-100 p-1 rounded-xl mb-8">{["login","register"].map(x=><button onClick={()=>setT(x)} className={`flex-1 py-3 rounded-lg ${t===x?"bg-white shadow text-primary":""}`}>{x==="login"?"Вход":"Регистрация"}</button>)}</div>{ok?<div className="text-center"><div className="text-6xl mb-5">✉</div><h1 className="text-2xl font-bold">Успешная регистрация</h1><p className="text-gray-500 my-5">Для завершения регистрации необходимо нажать на ссылку в письме, отправленном на [user_email]</p><button className="text-primary">Изменить почту</button></div>:<><h1 className="text-2xl font-bold mb-8">{t==="login"?"Добро пожаловать обратно. Авторизуйтесь, чтобы начать торговать":"Присоединяйтесь к Bin и начните торговать сразу после регистрации"}</h1><div className="space-y-4">{(t==="login"?["Электронная почта","Пароль"]:["Имя","Электронная почта","Пароль","Повторите пароль","Реферальный код"]).map((x,i)=><input key={x} type={x.includes("Пароль")?"password":"text"} placeholder={x} className="w-full border rounded-xl px-4 py-3 outline-primary"/>) }<label className="text-sm text-gray-500 block"><input type="checkbox"/> {t==="login"?" Запомнить в системе":" Я принимаю условия соглашения"}</label><Btn onClick={()=>t==="login"?go("dashboard"):setOk(true)} className="w-full">{t==="login"?"Войти":"Создать аккаунт"}</Btn></div><p className="text-center text-gray-500 mt-6">{t==="login"?"Еще нет аккаунта ":"Уже есть аккаунт "}<button className="text-primary" onClick={()=>setT(t==="login"?"register":"login")}>{t==="login"?"Зарегистрируйтесь":"Войти"}</button></p></>}</main><Footer/></div>}
function Dashboard({go}){return <Layout go={go} active="dashboard"><main className="max-w-6xl mx-auto px-4 md:px-8 py-8"><h1 className="text-2xl font-bold mb-8">Добро пожаловать, [username]</h1><Card className="gradient p-6 mb-8"><small className="text-white/70">Ваш счет</small><div className="text-4xl font-bold my-2">0 ₽</div><div className="flex gap-3 mt-6"><Btn onClick={()=>go("finance")} variant="green" icon="plus">Пополнить счет</Btn><Btn onClick={()=>go("finance")} variant="ghost">Мой счёт</Btn></div></Card><h2 className="text-xl font-bold mb-5">Актив дня</h2><div className="grid md:grid-cols-2 gap-5">{["BTC/USDT","ETH/USDT"].map((a,i)=><Card className="bg-[#24242E] p-5 border border-white/5"><div className="flex justify-between"><b>{a}</b><span className="text-profit">▲ 78%</span></div><Mini green={i===1}/><Btn onClick={()=>go("trade")} className="w-full">Торговать</Btn></Card>)}</div><div className="mt-8 bg-[#24242E] rounded-xl p-4 flex gap-3"><Icon name="check-circle" className="text-profit"/><div><b>Подтверждение почты</b><p className="text-gray-500 text-sm">Ваша почта успешно подтверждена!</p></div><span className="ml-auto text-primary text-sm">Смотреть все</span></div></main></Layout>}
function Finance({go}){useIcons();const[t,setT]=useState("deposit"),[method,setMethod]=useState(null);let ps=[["visa","VISA","credit-card","from-blue-600 to-blue-800"],["mastercard","Mastercard","credit-card","from-orange-500 to-red-600"],["mir","МИР","landmark","from-green-500 to-emerald-700"]];return <Layout go={go}><main className="max-w-5xl mx-auto px-4 md:px-8 py-8"><div className="flex gap-3 items-center mb-8"><div className="p-3 rounded-2xl bg-primary/15"><Icon name="wallet" className="text-primary"/></div><div><h1 className="text-2xl font-bold">Финансы</h1><p className="text-gray-500 text-sm">Управление балансом и операциями</p></div></div><div className="gradient rounded-2xl p-6 mb-8"><small className="text-white/60">Текущий баланс</small><div className="text-4xl font-bold my-2">0 ₽</div><span className="text-white/70 text-sm">Безопасное управление средствами</span></div><div className="bg-[#24242E] p-1 rounded-xl flex mb-8">{[["deposit","Пополнить счет","plus-circle"],["withdraw","Вывести средства","arrow-up-right"],["history","История","history"]].map(x=><button onClick={()=>setT(x[0])} className={`flex-1 py-3 rounded-lg flex justify-center gap-2 text-sm ${t===x[0]?"bg-primary text-white":"text-gray-500"}`}><Icon name={x[2]}/><span className="hidden sm:inline">{x[1]}</span></button>)}</div>{t==="deposit"&&<><h2 className="text-xl font-semibold">Пополнение счета</h2><p className="text-gray-500 text-sm mt-1 mb-6">Выберите удобный способ пополнения баланса</p><div className="grid md:grid-cols-3 gap-4">{ps.map(p=><button onClick={()=>setMethod(p[0])} className={`text-left bg-[#24242E] border rounded-2xl p-5 hover:-translate-y-1 transition ${method===p[0]?"border-primary ring-2 ring-primary/20":"border-white/5"}`}><div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${p[3]} flex items-center justify-center mb-5`}><Icon name={p[2]} className="text-white w-7 h-7"/></div><h3 className="text-white font-semibold text-lg">{p[1]}</h3><p className="text-gray-500 text-sm my-2">Банковская карта</p><span className="text-profit text-sm">Комиссия 0%</span></button>)}</div>{method&&<Card className="bg-[#24242E] border border-white/5 p-6 mt-6"><h3 className="font-semibold mb-5">Сумма пополнения</h3><input placeholder="₽  Введите сумму" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white outline-none focus:border-primary"/><div className="grid grid-cols-3 gap-2 my-5">{[1000,5000,10000].map(a=><button className="py-3 rounded-xl bg-white/5 text-gray-300">{a.toLocaleString()} ₽</button>)}</div><Btn className="w-full" icon="arrow-right">Продолжить</Btn></Card>}</>}{t==="withdraw"&&<Card className="bg-[#24242E] p-6 max-w-lg"><h2 className="font-semibold mb-5">Вывод средств</h2><input placeholder="Введите сумму ₽" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white mb-4"/><input placeholder="Номер карты или счета" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white mb-4"/><Btn className="w-full">Создать заявку</Btn></Card>}{t==="history"&&<div className="text-center py-16 text-gray-500">История транзакций пока что пуста</div>}<Risk/></main></Layout>}
function Trade({go}){return <Layout go={go}><main className="max-w-6xl mx-auto px-4 md:px-8 py-6"><div className="flex justify-between items-center mb-6"><div className="bg-[#24242E] rounded-xl px-5 py-3"><b>₿ BTC / USDT</b></div><span className="text-profit">1 - 5 мин 78% ▲</span></div><div className="gridbg rounded-2xl h-80 md:h-96 p-4"><svg viewBox="0 0 400 180" preserveAspectRatio="none" className="w-full h-full">{Array.from({length:14},(_,i)=><rect x={i*28+10} y={20+(i%5)*12} width="10" height={i%3?35:55} fill={i%2?"#28A745":"#FF5722"}/>)}</svg></div><div className="grid md:grid-cols-3 gap-4 mt-6">{[["Сумма сделки","₽ 100"],["Время сделки","23:26"],["Доходность 78%","78,00 ₽"]].map(x=><Card className="bg-[#24242E] p-5"><small className="text-gray-500">{x[0]}</small><div className="text-2xl font-bold mt-3 text-white">{x[1]}</div></Card>)}</div><div className="grid grid-cols-2 gap-4 mt-6"><button className="h-24 rounded-2xl bg-profit text-4xl">↑</button><button className="h-24 rounded-2xl bg-danger text-4xl">↓</button></div><Risk/></main></Layout>}
function Simple({go,type}){let data={profile:["Личный кабинет","Профиль"],support:["Техническая поддержка","Создайте обращение в кабинете или напишите в Telegram. Для быстрой помощи укажите ID профиля."],history:["История","История транзакций пока что пуста"]}[type];return <Layout go={go} active={type}><main className="max-w-5xl mx-auto px-4 md:px-8 py-8"><h1 className="text-2xl font-bold mb-6">{data[0]}</h1><Card className="bg-[#24242E] p-6"><h2 className="font-semibold mb-3">{data[1]}</h2>{type==="support"&&<><p className="text-gray-400 mb-5">{data[1]}</p><Btn icon="send">Создать обращение</Btn><div className="mt-6 text-gray-500">Быстрый способ связаться с оператором поддержки.</div></>}{type==="profile"&&<><div className="flex items-center gap-4"><div className="w-16 h-16 rounded-full bg-primary flex items-center justify-center"><Icon name="user" className="w-8 h-8"/></div><div><b>[username]</b><p className="text-orange-400 text-sm">Не верифицирован</p></div></div><div className="grid md:grid-cols-2 gap-4 mt-6">{["id профиля","Почта","Телефон","id реферала"].map(x=><div><small className="text-gray-500">{x}</small><div className="h-10 bg-white/5 rounded-xl mt-2"/></div>)}</div></>}{type==="history"&&<p className="text-gray-500">{data[1]}</p>}</Card><Risk/></main></Layout>}
function App(){const[p,setP]=useState("landing"),go=x=>{setP(x);scrollTo(0,0)};if(p==="landing")return <Landing go={go}/>;if(p==="auth")return <Auth go={go}/>;if(p==="dashboard")return <Dashboard go={go}/>;if(p==="finance")return <Finance go={go}/>;if(p==="trade")return <Trade go={go}/>;return <Simple go={go} type={p==="profile"?"profile":p==="support"?"support":"history"}/>};ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
