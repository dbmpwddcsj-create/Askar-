<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

<body>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;


/* =====================================
   ICON COMPONENT
===================================== */

function Icon({ name, size = 20, className = "" }) {
    useEffect(() => {
        if (window.lucide) {
            lucide.createIcons();
        }
    });

    return (
        <i
            data-lucide={name}
            className={className}
            style={{ width: size, height: size }}
        ></i>
    );
}


/* =====================================
   BUTTON
===================================== */

function Button({
    children,
    onClick,
    variant = "primary",
    icon,
    className = "",
    disabled = false
}) {

    const styles = {
        primary: "bg-primary hover:bg-purple-700 text-white",
        green: "bg-profit hover:bg-green-600 text-white",
        danger: "bg-danger hover:bg-red-600 text-white",
        outline: "border border-primary text-primary hover:bg-primary hover:text-white",
        blue: "bg-blue-600 hover:bg-blue-700 text-white",
        ghost: "bg-white/5 hover:bg-white/10 text-gray-300",
        white: "bg-white text-gray-900 hover:bg-gray-100"
    };

    return (
        <button
            disabled={disabled}
            onClick={onClick}
            className={`
                rounded-xl px-5 py-3 font-medium
                transition-all duration-200
                flex items-center justify-center gap-2
                btn-shadow
                ${styles[variant]}
                ${disabled ? "opacity-50 cursor-not-allowed" : ""}
                ${className}
            `}
        >
            {icon && <Icon name={icon} size={18}/>}
            {children}
        </button>
    );
}


/* =====================================
   INPUT
===================================== */

function Input({
    label,
    placeholder,
    type = "text",
    dark = false,
    icon
}) {
    return (
        <div className="space-y-2">
            {label && (
                <label className={`${dark ? "text-gray-500" : "text-gray-500"} text-sm`}>
                    {label}
                </label>
            )}

            <div className="relative">
                {icon && (
                    <Icon
                        name={icon}
                        size={18}
                        className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
                    />
                )}

                <input
                    type={type}
                    placeholder={placeholder}
                    className={`
                        w-full rounded-xl px-4 py-3 outline-none transition
                        ${icon ? "pl-11" : ""}
                        ${
                            dark
                            ? "bg-white/5 border border-white/10 text-white placeholder-gray-600 focus:border-primary"
                            : "bg-white border border-gray-200 text-gray-900 focus:border-primary"
                        }
                    `}
                />
            </div>
        </div>
    );
}


/* =====================================
   CARD
===================================== */

function Card({ children, className = "" }) {
    return (
        <div className={`rounded-2xl ${className}`}>
            {children}
        </div>
    );
}


/* =====================================
   FOOTER
===================================== */

function Footer({ dark = false }) {

        <footer
            className={`

                    dark

                }
                border-t text-center py-6 text-sm
            `}
        >
            Все права защищены 2026. Bin
        </footer>

}


/* =====================================
   RISK WARNING
===================================== */

function RiskWarning() {

            Торговые операции, осуществляемые на платформе, сопряжены с существенным риском потери капитала. Пожалуйста, внимательно ознакомьтесь с общими условиями торговли, представленными на нашем сайте, перед осуществлением любых инвестиций. Вам предоставляется право личного, некоммерческого использования информационной системы, размещенной на данном сайте. Право использования является ограниченным и неисключительным. Деятельность компании ведется за пределами Российской Федерации.

        </div>

/* =====================================
   MINI CHART
===================================== */

function MiniChart({ green = false }) {

    return (
        <svg
            viewBox="0 0 300 100"
            className="w-full h-24"
            preserveAspectRatio="none"
        >
            <defs>
                <linearGradient id="chartGradient" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0%" stopColor={green ? "#28A745" : "#7B3FE4"} stopOpacity=".35"/>
                    <stop offset="100%" stopColor={green ? "#28A745" : "#7B3FE4"} stopOpacity="0"/>
                </linearGradient>
            </defs>

            <polygon
                fill="url(#chartGradient)"
                points="0,80 25,65 45,72 65,40 85,52 110,28 135,44 160,20 180,35 205,15 230,28 250,8 275,18 300,5 300,100 0,100"
            />

            <polyline
                fill="none"
                stroke={green ? "#28A745" : "#7B3FE4"}
                strokeWidth="3"
                points="0,80 25,65 45,72 65,40 85,52 110,28 135,44 160,20 180,35 205,15 230,28 250,8 275,18 300,5"
            />
        </svg>
    );
}


/* =====================================
   CANDLESTICK CHART
===================================== */

function CandlestickChart() {

    const candles = [
        [20,100,70,45,true],
        [45,90,60,25,false],
        [70,80,50,20,true],
        [95,95,60,35,true],
        [120,70,40,10,false],
        [145,75,45,25,true],
        [170,55,30,5,true],
        [195,65,40,15,false],
        [220,50,25,0,true],
        [245,45,20,5,true],
        [270,35,15,0,false],
        [295,30,10,0,true],
        [320,40,20,5,false],
        [345,25,5,0,true]
    ];

    return (
        <div className="h-80 md:h-96 chart-grid rounded-2xl relative overflow-hidden p-4">

            <svg
                viewBox="0 0 370 180"
                preserveAspectRatio="none"
                className="w-full h-full"
            >

                <line x1="0" y1="45" x2="370" y2="45" stroke="#ffffff12"/>
                <line x1="0" y1="90" x2="370" y2="90" stroke="#ffffff12"/>
                <line x1="0" y1="135" x2="370" y2="135" stroke="#ffffff12"/>

                {candles.map((c, i) => {

                    const x = c[0];
                    const high = c[1];
                    const low = c[2];
                    const green = c[4];

                    const open = c[3];
                    const close = green ? c[2] - 15 : c[2] + 15;

                    return (
                        <g key={i}>

                            <line
                                x1={x}
                                y1={high}
                                x2={x}
                                y2={low}
                                stroke={green ? "#28A745" : "#FF5722"}
                                strokeWidth="1.5"
                            />

                            <rect
                                x={x - 5}
                                y={Math.min(open, close)}
                                width="10"
                                height={Math.max(8, Math.abs(open - close))}
                                fill={green ? "#28A745" : "#FF5722"}
                                rx="1"
                            />

                        </g>
                    );
                })}

                <polyline
                    fill="none"
                    stroke="#28A745"
                    strokeWidth="1.5"
                    strokeDasharray="4 4"
                    points="0,65 370,65"
                />

            </svg>

            <div className="absolute right-3 top-[35%] bg-profit text-white text-xs px-3 py-1 rounded">
                98 240,50
            </div>

            <div className="absolute bottom-3 left-4 text-xs text-gray-500">
                23:15
            </div>

            <div className="absolute bottom-3 right-4 text-xs text-gray-500">
                23:30
            </div>

        </div>
    );
}


/* =====================================

===================================== */

/* =====================================

/* =====================================
   APP
===================================== */

function App() {

    const [page, setPage] = useState("landing");

    const navigate = (target) => {
        setPage(target);
        window.scrollTo(0, 0);
    };


    switch (page) {

        case "landing":
            return <Landing onNavigate={navigate}/>;

        case "auth":
            return <Auth onNavigate={navigate}/>;

        case "dashboard":
            return <Dashboard onNavigate={navigate}/>;

        case "trade":
            return <Trade onNavigate={navigate}/>;

        case "finance":
            return <Finance onNavigate={navigate}/>;

        case "profile":
            return <Profile onNavigate={navigate}/>;

        case "support":
            return <Support onNavigate={navigate}/>;

        case "history":
            return <History onNavigate={navigate}/>;

        default:
            return <Landing onNavigate={navigate}/>;

    }

}


ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
