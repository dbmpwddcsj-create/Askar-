<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bin — Crypto Terminal</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "system-ui", "sans-serif"]
          }
        }
      }
    };
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #f7f9fc;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .glass {
      background: rgba(255, 255, 255, .78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .dark .glass {
      background: rgba(15, 23, 42, .78);
    }

    .soft-shadow {
      box-shadow: 0 20px 60px rgba(15, 23, 42, .08);
    }

    .dark .soft-shadow {
      box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
    }

    .chart-grid {
      background-image:
        linear-gradient(rgba(148, 163, 184, .10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, .10) 1px, transparent 1px);
      background-size: 42px 42px;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      scrollbar-width: none;
    }

    .coin-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
    }

    .coin-icon svg {
      width: 25px;
      height: 25px;
    }

    .gradient-text {
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .animate-fade {
      animation: fade .25s ease-out;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .mobile-scroll {
        overflow-x: auto;
      }
    }
  </style>
</head>

    function Icon({ name, size = 18, className = "" }) {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      return (
        <i
          data-lucide={name}
          className={className}
          style={{ width: size, height: size }}
        />
      );
    }

    function Button({ children, onClick, variant = "primary", className = "", type = "button" }) {
      const variants = {
        primary: "bg-blue-600 text-white hover:bg-blue-700",
        secondary: "bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700",
        ghost: "text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800",
        danger: "bg-rose-600 text-white hover:bg-rose-700",
        success: "bg-emerald-600 text-white hover:bg-emerald-700",
        outline: "border border-slate-200 text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800"
      };

      return (
        <button
          type={type}
          onClick={onClick}
          className={
            "inline-flex items-center justify-center gap-2 rounded-xl px-4 py-3 text-sm font-semibold transition " +
            variants[variant] +
            " " +
            className
          }
        >
          {children}
        </button>
      );
    }

    function Card({ children, className = "" }) {
      return (
        <div className={
          "rounded-2xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900 " +
          className
        }>
          {children}
        </div>
      );
    }

    function Input({ label, value, onChange, placeholder, type = "text", suffix, min, step }) {
      return (
        <label className="block">
          {label && (
            <span className="mb-2 block text-sm font-medium text-slate-500 dark:text-slate-400">
              {label}
            </span>
          )}

          <div className="relative">
            <input
              type={type}
              value={value}
              onChange={onChange}
              placeholder={placeholder}
              min={min}
              step={step}
              className={
                "w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition " +
                "focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 " +
                "dark:border-slate-700 dark:bg-slate-800 dark:text-white"
              }
            />

            {suffix && (
              <span className="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-sm font-semibold text-slate-400">
                {suffix}
              </span>
            )}
          </div>
        </label>
      );
    }

    function CoinIcon({ symbol, size = "md" }) {
      const meta = coinMeta[symbol?.toLowerCase()] || {
        bg: "#64748b",
        color: "#fff",
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>`
      };

      const sizes = {
        sm: "w-9 h-9 rounded-xl",
        md: "w-11 h-11 rounded-xl",
        lg: "w-14 h-14 rounded-2xl"
      };

      return (
        <div
          className={"coin-icon " + sizes[size]}
          style={{ background: meta.bg, color: meta.color }}
          dangerouslySetInnerHTML={{ __html: meta.icon }}
        />
      );
    }

    function formatPrice(price) {
      if (price >= 1000) {
        return "$" + price.toLocaleString("en-US", {
          maximumFractionDigits: 2
        });
      }

      if (price >= 1) {
        return "$" + price.toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 4
        });
      }

      return "$" + price.toLocaleString("en-US", {
        minimumFractionDigits: 4,
        maximumFractionDigits: 8
      });
    }

    function formatMoney(value) {
      return Number(value || 0).toLocaleString("en-US", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 2
      });
    }

    function formatAmount(value) {
      return Number(value || 0).toLocaleString("en-US", {
        maximumFractionDigits: 8
      });
    }

    function getCoinById(coins, id) {
      return coins.find(c => c.id === id) || coins[0];
    }

    function normalizeCoin(item) {
      return {
        id: item.id,
        symbol: item.symbol.toLowerCase(),
        name: item.name,
        price: item.current_price || 0,
        change: item.price_change_percentage_24h || 0,
        image: item.image,
        sparkline: item.sparkline_in_7d?.price || []
      };
    }

    function MiniChart({ positive = true }) {
      const points = positive
        ? "0,76 20,68 40,72 60,51 80,58 100,44 120,49 140,25 160,34 180,15 200,23 220,8"
        : "0,18 20,25 40,16 60,38 80,31 100,49 120,43 140,62 160,54 180,72 200,63 220,83";

      return (
        <svg viewBox="0 0 220 90" className="h-full w-full">
          <defs>
            <linearGradient id={positive ? "greenGradient" : "redGradient"} x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor={positive ? "#10b981" : "#f43f5e"} stopOpacity=".24"/>
              <stop offset="100%" stopColor={positive ? "#10b981" : "#f43f5e"} stopOpacity="0"/>
            </linearGradient>
          </defs>

          <polyline
            points={points}
            fill="none"
            stroke={positive ? "#10b981" : "#f43f5e"}
            strokeWidth="3"
            strokeLinecap="round"
            strokeLinejoin="round"
          />

          <polyline
            points={"0,90 " + points + " 220,90"}
            fill={`url(#${positive ? "greenGradient" : "redGradient"})`}
            stroke="none"
          />
        </svg>
      );
    }

    function CandlestickChart({ positive = true }) {
      const candles = [
        [58, 82, 44, 67, true],
        [66, 75, 51, 61, false],
        [78, 91, 63, 70, true],
        [88, 71, 48, 55, true],
        [99, 65, 42, 49, false],
        [110, 61, 35, 44, true],
        [121, 55, 30, 37, true],
        [132, 68, 41, 58, false],
        [143, 59, 32, 44, true],
        [154, 51, 24, 36, true],
        [165, 46, 20, 31, true],
        [176, 57, 29, 42, false],
        [187, 42, 17, 25, true],
        [198, 36, 12, 20, true],
        [209, 49, 20, 35, false]
      ];

      const up = "#10b981";
      const down = "#f43f5e";

      return (
        <svg viewBox="0 0 230 100" className="h-full w-full">
          {candles.map((c, index) => {
            const [x, high, low, close, isUp] = c;
            const open = isUp ? close + 10 : close - 10;
            const top = Math.min(open, close);
            const height = Math.abs(open - close);

            return (
              <g key={index}>
                <line
                  x1={x}
                  x2={x}
                  y1={high}
                  y2={low}
                  stroke={isUp ? up : down}
                  strokeWidth="2"
                  strokeLinecap="round"
                />

                <rect
                  x={x - 4}
                  y={top}
                  width="8"
                  height={Math.max(height, 5)}
                  rx="1.5"
                  fill={isUp ? up : down}
                />
              </g>
            );
          })}
        </svg>
      );
    }

      return (

    function Trade({ coins, selectedCoinId, setSelectedCoinId, balance, setBalance }) {
      const selected = getCoinById(coins, selectedCoinId);

      const [orderType, setOrderType] = useState("market");
      const [side, setSide] = useState("buy");
      const [amount, setAmount] = useState("");
      const [price, setPrice] = useState(selected.price);
      const [message, setMessage] = useState("");

      useEffect(() => {
        setPrice(selected.price);
      }, [selected.id, selected.price]);

      const numericAmount = Number(amount) || 0;
      const numericPrice = Number(price) || selected.price;
      const total = numericAmount * numericPrice;
      const fee = total * 0.001;
      const finalTotal = side === "buy" ? total + fee : total - fee;

      const quantity = side === "buy"
        ? numericAmount / numericPrice
        : numericAmount;

      function submitOrder() {
        if (!numericAmount || numericAmount <= 0) {
          setMessage("Введите сумму сделки.");
          return;
        }

        if (side === "buy" && finalTotal > balance) {
          setMessage("Недостаточно средств для покупки.");
          return;
        }

        setMessage(
          side === "buy"
            ? `Заявка на покупку ${selected.symbol.toUpperCase()} создана.`
            : `Заявка на продажу ${selected.symbol.toUpperCase()} создана.`

          </div>

          <Card className="mt-5 border-slate-800 bg-slate-900 p-6">
            <h3 className="text-xl font-black">Задать вопрос</h3>

            <textarea
              value={question}
              onChange={e => setQuestion(e.target.value)}
              placeholder="Напишите ваш вопрос..."
              rows="6"
              className="mt-5 w-full resize-none rounded-2xl border border-slate-700 bg-slate-950 p-4 text-sm text-white outline-none focus:border-blue-500"
            />

            <Button
              onClick={() => {
                setSent(true);
                setQuestion("");
              }}
              className="mt-4"
            >
              Отправить сообщение
              <Icon name="send" size={17}/>
            </Button>

            {sent && (
              <div className="mt-4 rounded-xl bg-emerald-500/10 p-3 text-sm text-emerald-400">
                Сообщение отправлено в демо-режиме.
              </div>
            )}
          </Card>
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = useState("landing");
      const [authMode, setAuthMode] = useState("login");
      const [page, setPage] = useState("dashboard");
      const [dark, setDark] = useState(true);
      const [coins, setCoins] = useState(FALLBACK_COINS);
      const [selectedCoinId, setSelectedCoinId] = useState("bitcoin");
      const [balance, setBalance] = useState(12480);

      useEffect(() => {
        document.documentElement.classList.toggle("dark", dark);
      }, [dark]);

      useEffect(() => {
        let active = true;

        async function loadCoins() {
          try {
            const response = await fetch(API_URL);

            if (!response.ok) {
              throw new Error("Market API error");
            }

            const data = await response.json();

            if (active && Array.isArray(data) && data.length) {
              const normalized = data.map(normalizeCoin);
              setCoins(normalized);
            }
          } catch (error) {
            console.warn("Используются резервные котировки:", error);
          }
        }

        loadCoins();

        const interval = setInterval(loadCoins, 60000);

        return () => {
          active = false;
          clearInterval(interval);
        };
      }, []);

      function openAuth(mode) {
        setAuthMode(mode);
        setScreen("auth");
      }

      function openTerminal() {
        setScreen("app");
        setPage("trade");
      }

      if (screen === "landing") {
        return <Landing onAuth={openAuth}/>;
      }

      if (screen === "auth") {
        return (
          <Auth
            mode={authMode}
            onBack={() => setScreen("landing")}
            onSuccess={() => setScreen("app")}
          />
        );
      }

      return (
        <DarkLayout
          page={page}
          setPage={setPage}
          onLogout={() => setScreen("landing")}
          dark={dark}
          onTheme={() => setDark(!dark)}
        >
          {page === "dashboard" && (
            <Dashboard
              coins={coins}
              setPage={setPage}
              onSelectCoin={(id) => {
                setSelectedCoinId(id);
                setPage("trade");
              }}
            />
          )}

          {page === "trade" && (
            <Trade
              coins={coins}
              selectedCoinId={selectedCoinId}
              setSelectedCoinId={setSelectedCoinId}
              balance={balance}
              setBalance={setBalance}
            />
          )}

          {page === "finance" && (
            <Finance balance={balance} setBalance={setBalance}/>
          )}

          {page === "history" && <History/>}

          {page === "profile" && <Profile/>}

          {page === "support" && <Support/>}
        </DarkLayout>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
